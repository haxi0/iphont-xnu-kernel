# POCO X5 Pro 5G -- the device HackiOS was brought up on.
NAME="POCO X5 Pro 5G (redwood)"
KIND=phone
SOC="Qualcomm Snapdragon 778G (SM7325)"
CODENAMES="redwood"              # ro.product.device of the phones this profile is for: nothing is written to any other

UEFI_TARGET=redwood
UEFI_FD=
DTB=
FD_BASE=0x9FD00000
FD_SIZE=0x200000
PAYLOAD_BASE=0xF0000000

FB_BASE=0xE1000000              # 1080 x 2400; xnuloader picks platform_redwood by it
WIFI_ATH11K=1                   # WCN6750
BOARD_ARGS=""                   # the kernel's defaults are this phone's (tools/board-from-dt.py reads the same)

# bootcpu=7: run on the big core; cpufreq=1: top speed; add gpu=1 (with GL=1 images), wifi=1, adsp=1
BOOTARGS="touchscreen=1 cpufreq=1 bootcpu=7 cpus=8"
DEFAULT_SECS=900
USERLAND_VARS=""
# taken from the phone's Android with adb (see README.md, "On the phone")
FIRMWARE="fw-gpu fw-wifi fw-audio fw-haptic"

# --- installed mode (dual boot from the flash, no computer) ------------------------------------------
# The kernel's command line for a session that lasts until the phone is switched off: root on the iOS
# volume in darwin, the var store kept between boots, and the hardware on.
FLASH_BOOTARGS="root_apfs=ufs_darwin ufs=2 ufs_native=1 bootcpu=7 cpus=8 cpufreq=1 touchscreen=1 gpu=1 adsp=1 sound=4 wifi=1 var_store=1 ufs_write=1"
FLASH_USERLAND_VARS="CRYPTEXES=flash FLASHBOOT=1 GL=1 REST=1"
