# Device profile: sourced by common/build.sh and common/run.sh. Copy with common/new-device.sh.
# Everything here is plain shell variables; see docs/PORTING.md for where each value comes from.

NAME="OnePlus 8 (instantnoodle)"
KIND=phone                      # phone | qemu
SOC="Qualcomm Snapdragon 865 (SM8250)"

# --- boot chain (phones) ---------------------------------------------------------------------------
# The phone boots a Mu-Silicium UEFI (Project Silicium) with `fastboot boot`; the UEFI starts our loader.
UEFI_TARGET=instantnoodle
UEFI_FD=                        # a built SILICIUM_UEFI.fd; empty: Mu-Silicium/Build/<target>Pkg/... or prebuilt/uefi
DTB=                            # empty: Mu-Silicium/Resources/DTBs/instantnoodle.dtb (uefi/files: the stock OxygenOS 11 boot image's; ABL picks it by msm-id/board-id)
FD_BASE=0x9FC00000              # Mu-Silicium kona (kebabPkg memory map: "UEFI FD")
FD_SIZE=0x300000
PAYLOAD_BASE=0xF0000000         # where the kernel + images container goes (free RAM in the memory map)

# --- kernel and loader -----------------------------------------------------------------------------
# xnuloader/loader.c picks its `struct platform` by what the firmware reports (see docs/PORTING.md):
# a new SoC needs one there (common/new-device.sh writes a starting point next to this file).
FB_BASE=0x9C000000              # ABL continuous splash ("Display Reserved"), 1080 x 2400
WIFI_ATH11K=0                   # the OnePlus 8's radio is a QCA6390 on PCIe: redwood's WCN6750 path does not apply

# --- what the run needs ----------------------------------------------------------------------------
# touch, keys and the battery come with board=instantnoodle (xnuloader); cpufreq: EPSS as redwood;
# haptic=5: the AW8697 for iOS (needs fw-haptic); torch=3: the PM8150L flash LED for iOS;
# gpu=1: the Adreno 650 for CoreAnimation (needs fw-gpu and an image built with GL=1);
# adsp=1 sound=4: iOS's sound through the audio DSP to the TFA9874s (needs fw-audio); sound_amps=1 lets them
# play (the kernel's default here is 0), sound_below=480 at most 60 dB under Android's level, iOS's volume
# under that: not yet heard -- raise sound_below's level (lower number) only step by step
BOOTARGS="cpus=8 cpufreq=1 bootcpu=7 haptic=5 torch=3 gpu=1 adsp=1 sound=4 sound_amps=1 sound_below=480"
DEFAULT_SECS=900
USERLAND_VARS="GL=1"            # Mesa (freedreno) for gpu=1: tools/mk-mesa.sh
# The phone's own firmware, taken from its Android (never in the repository): see docs/PORTING.md.
FIRMWARE="fw-haptic fw-gpu fw-audio"   # fw-audio: adsp.mdt/.bNN (modem partition, image/), tfa98xx.cnt (/vendor/firmware)
