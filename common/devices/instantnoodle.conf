# Device profile: sourced by common/build.sh and common/run.sh. Copy with common/new-device.sh.
# Everything here is plain shell variables; see docs/PORTING.md for where each value comes from.

NAME="OnePlus 8 (instantnoodle)"
KIND=phone                      # phone | qemu
SOC="Qualcomm Snapdragon 865 (SM8250)"

# --- boot chain (phones) ---------------------------------------------------------------------------
# The phone boots a Mu-Silicium UEFI (Project Silicium) with `fastboot boot`; the UEFI starts our loader.
UEFI_TARGET=instantnoodle
UEFI_FD=                        # a built SILICIUM_UEFI.fd; empty: Mu-Silicium/Build/<target>Pkg/... or prebuilt/uefi
DTB=                            # empty: Mu-Silicium/Resources/DTBs/instantnoodle.dtb (uefi/files: the stock OxygenOS 11 boot image's; ABL picks it by msm-id/board-id)
FD_BASE=0x9FC00000              # Mu-Silicium kona (kebabPkg memory map: "UEFI FD")
FD_SIZE=0x300000
PAYLOAD_BASE=0xF0000000         # where the kernel + images container goes (free RAM in the memory map)

# --- kernel and loader -----------------------------------------------------------------------------
# xnuloader/loader.c picks its `struct platform` by what the firmware reports (see docs/PORTING.md):
# a new SoC needs one there (common/new-device.sh writes a starting point next to this file).
FB_BASE=0x9C000000              # ABL continuous splash ("Display Reserved"), 1080 x 2400
WIFI_ATH11K=0                   # the OnePlus 8's radio is a QCA6390 on PCIe: redwood's WCN6750 path does not apply

# --- what the run needs ----------------------------------------------------------------------------
# touch, keys and the battery come with board=instantnoodle (xnuloader); cpufreq: EPSS as redwood;
# haptic=5: the AW8697 for iOS (needs fw-haptic); torch=3: the PM8150L flash LED for iOS;
# gpu=1: the Adreno 650 for CoreAnimation (needs fw-gpu and an image built with GL=1);
# adsp=1 sound=4: iOS's sound through the audio DSP to the TFA9874s (needs fw-audio); sound_amps=1 lets them
# play (the kernel's default here is 0), sound_below=96 at most 12 dB under Android's level, iOS's volume
# under that (heard, 2026-10-24); slider_cal: the factory calibration of the alert slider, persist:/engineermode/tri_state_hall_data
# sb_clock=24: the status bar's clock is centred 24 points (of 375) further right, the camera hole is a 68 px
# circle at x 61-137 (of 1080) in the top left corner and iOS puts the clock under it (libhackios-sb: statusbar_clock)
BOOTARGS="cpus=8 cpufreq=1 bootcpu=7 haptic=5 torch=3 gpu=1 adsp=1 sound=4 sound_amps=1 sound_below=96 slider_cal=36,110,64,71,105,39 sb_clock=24"
DEFAULT_SECS=900
USERLAND_VARS="GL=1"            # Mesa (freedreno) for gpu=1: tools/mk-mesa.sh
# The phone's own firmware, taken from its Android (never in the repository): see docs/PORTING.md.
FIRMWARE="fw-haptic fw-gpu fw-audio fw-wifi"   # fw-audio: adsp.mdt/.bNN (modem partition, image/), tfa98xx.cnt (/vendor/firmware); fw-wifi: amss.bin, m3.bin (linux-firmware ath11k/QCA6390/hw2.0/), 12wlan.b0c (modem image/), mac

# --- installed mode (boots from the flash, no computer: docs/INSTALL.md, "A phone without Android") -----------
# No Android here: its userdata is the port's store, and the slot the bootloader starts (_b) has OxygenOS's kernel
# in boot_b and nothing to run it. The UEFI with the loader goes into that boot_b (fastboot flash, its backup in
# ios-instantnoodle/backup/partitions/boot_b.img), the bundle into userdata's boot area through the loader's own
# USB link (xl install): common/flash/install-xl.sh. recovery_a/_b (TWRP), abl, xbl and the GPT are not written.
FLASH_VIA=xl
FLASH_BOOT_PART=boot_b
FLASH_BOOT_BACKUP=../ios-instantnoodle/backup/partitions/boot_b.img
FASTBOOT_PRODUCT=kona               # what its fastboot says (getvar product): nothing is flashed on anything else
# the run's arguments: root on the iOS volume in userdata; /private/var an HFS+ volume (journaled) on the rest of
# it, from block 3145728 to the end (hk_data=1, var_data=hfs: bsd/dev/hk_ufs.c, userland/src/init.c), made there
# once (var_data_format=1: only where neither volume header is found) and the var store's archive copied in once
# (var_store=1, which also tells the boot guard the system came up); ufs_write=1: written past the cryptexes only.
# sb_delay=8 as xl run gives it (userland/src/inject_sb.c: the applications registered before the home screen)
FLASH_BOOTARGS="$BOOTARGS ufs=2 root_apfs=ufs_darwin ufs_write=1 hk_data=1 var_data=hfs var_data_format=1 var_store=1 sb_delay=8"
FLASH_USERLAND_VARS="CRYPTEXES=flash FLASHBOOT=1 GL=1 REST=1 RC_JOBS=rc.jobs.installed"   # no diagnostics at every boot
